<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pokemon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">Pokemon List</h2>
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div th:each="pokemon : ${pokemonList}" class="card mb-3 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title fw-bold" th:text="${pokemon.name}">Pokemon Name</h5>
                    <p class="card-text text-muted"
                       th:text="${pokemon.category != null ? pokemon.category.category : 'No Category Assigned'}">
                        Category
                    </p>
                    <a th:href="@{'/pokemon/delete/' + ${pokemon.id}}"
                       class="btn btn-sm btn-danger mt-2"
                       onclick="return confirm('Are you sure you want to delete this Pokémon?');">
                        Delete
                    </a>
                </div>
            </div>
        </div>
    </div>

    <h2 class="text-center mt-5 mb-4">Categories</h2>
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div th:each="category : ${categories}" class="card mb-3 border-success shadow-sm">
                <div class="card-body">
                    <h5 class="card-title text-success fw-bold" th:text="${category.category}">Category Name</h5>
                    <ul class="list-group list-group-flush mt-2">
                        <li class="list-group-item"
                            th:each="pokemon : ${category.pokemonList}"
                            th:text="${pokemon.name}">
                            Pokemon Name
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a href="/pokemon/add" class="btn btn-primary">Add New Pokémon</a>
    </div>

</div>
</body>
</html>
