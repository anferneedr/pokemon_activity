<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Pokemon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">Edit Pokémon</h2>

    <form th:action="@{'/pokemon/update/' + ${pokemon.id}}" th:object="${pokemon}" method="post" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label for="name" class="form-label">Name:</label>
            <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Enter Pokemon name">
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">Type:</label>
            <select id="category" th:field="*{category.id}" class="form-select">
                <option value="" disabled>Select Category</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.category}"></option>
            </select>
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-success">Update</button>
            <a href="/pokemon" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
